<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arena Defender | Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/accessibility.css" />
    <script type="module" src="js/app.js"></script>
  </head>

  <body data-page="profile">
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Arena Defender home"
        ><span class="brand-mark">AD</span><span>Arena <b>Defender</b></span></a
      >
      <nav class="site-nav" aria-label="Primary navigation">
        <a href="game.html">Play</a><a href="rankings.html">Rankings</a
        ><a href="instructions.html">How to play</a
        ><span class="nav-account" data-auth-slot></span>
      </nav>
      <button
        class="menu-toggle"
        type="button"
        aria-label="Open navigation"
        aria-expanded="false"
      >
        Menu
      </button>
    </header>
    <main class="content-page">
      <div class="page-heading">
        <div>
          <p class="eyebrow">player dossier / 05</p>
          <h1>Your <em>profile.</em></h1>
        </div>
      </div>
      <section class="profile-panel" id="profile-content">
        <div class="profile-identity">
          <div class="profile-avatar">AD</div>
          <div>
            <p class="eyebrow">Offline account</p>
            <h2 id="profile-name">Guest player</h2>
            <p id="profile-email">Log in to view your dossier.</p>
          </div>
        </div>
        <div class="profile-stats">
          <div>
            <span>Highest level</span><strong id="profile-level">-</strong>
          </div>
          <div>
            <span>Personal best</span><strong id="profile-score">-</strong>
          </div>
          <div>
            <span>Runs logged</span><strong id="profile-runs">-</strong>
          </div>
        </div>
        <a class="button button-primary" href="login.html" id="profile-action"
          >Access your dossier <span>-></span></a
        >
      </section>
      <section class="settings-panel" aria-labelledby="settings-heading">
        <div class="settings-heading">
          <p class="eyebrow">Control room / 06</p>
          <h2 id="settings-heading">player <em>settings.</em></h2>
        </div>
        <form id="settings-form" class="settings-grid">
          <label
            >Difficulty<select name="difficulty">
              <option value="practice">Practice</option>
              <option value="standard">Standard</option>
              <option value="hard">Hard</option>
            </select></label
          >
          <label
            >Master volume<input
              name="masterVolume"
              type="range"
              min="0"
              max="0.2"
              step="0.01"
          /></label>
          <label
            >Effects volume<input
              name="effectsVolume"
              type="range"
              min="0"
              max="0.2"
              step="0.01"
          /></label>
          <label
            >Music volume<input
              name="musicVolume"
              type="range"
              min="0"
              max="0.2"
              step="0.01"
          /></label>
          <label class="setting-check"
            ><input name="highContrast" type="checkbox" /> High contrast</label
          >
          <label class="setting-check"
            ><input name="largeText" type="checkbox" /> Large text</label
          >
          <label class="setting-check"
            ><input name="reducedEffects" type="checkbox" /> Reduced
            effects</label
          >
          <label class="setting-check"
            ><input name="aimAssist" type="checkbox" /> Aim assistance</label
          >
          <label class="setting-check"
            ><input name="screenShake" type="checkbox" /> Screen shake</label
          >
          <label>Move up<input name="up" type="text" maxlength="1" /></label>
          <label
            >Move down<input name="down" type="text" maxlength="1"
          /></label>
          <label
            >Move left<input name="left" type="text" maxlength="1"
          /></label>
          <label
            >Move right<input name="right" type="text" maxlength="1"
          /></label>
          <label>Fire key<input name="fire" type="text" maxlength="1" /></label>
          <label
            >Pause key<input name="pause" type="text" maxlength="1"
          /></label>
          <div
            class="settings-feedback"
            id="settings-feedback"
            role="status"
            aria-live="polite"
          ></div>
          <button class="button button-primary" type="submit">
            Save settings <span>-></span>
          </button>
        </form>
      </section>
    </main>
    <footer class="site-footer">
      <span>Arena Defender</span><span>Local player network</span
      ><a href="about.html">About the project</a>
    </footer>
  </body>
</html>
