<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arena Defender | Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="css/main.css" />
    <script type="module" src="js/app.js"></script>
</head>

<body data-page="register">
    <header class="site-header">
        <a class="brand" href="index.html" aria-label="Arena Defender home"><span
                class="brand-mark">AD</span><span>Arena <b>Defender</b></span></a>
        <nav class="site-nav" aria-label="Primary navigation">
            <a href="game.html">Play</a><a href="rankings.html">Rankings</a><a href="instructions.html">How to
                play</a><span class="nav-account" data-auth-slot></span>
        </nav>
        <button class="menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false">
            Menu
        </button>
    </header>

    <main class="form-page">
        <div class="form-intro">
            <p class="eyebrow">Pilot intake / 01</p>
            <h1>Join the<br /><em>defence.</em></h1>
            <p>
                Create a local pilot profile. Your account, progress, and scores stay
                in this browser.
            </p>
        </div>
        <form class="form-panel" id="register-form" novalidate>
            <div class="form-panel-heading">
                <span>New pilot profile</span><span class="form-step">01-02</span>
            </div>
            <div class="form-grid">
                <label>Username<input name="username" type="text" autocomplete="username" minlength="3" maxlength="18"
                        required /><small class="field-error"
                        data-error-for="username"></small></label><label>Email<input name="email" type="email"
                        autocomplete="email" required /><small class="field-error"
                        data-error-for="email"></small></label><label>Password<input name="password" type="password"
                        autocomplete="new-password" required /><small class="field-error"
                        data-error-for="password"></small></label><label>Confirm password<input name="confirmPassword"
                        type="password" autocomplete="new-password" required /><small class="field-error"
                        data-error-for="confirmPassword"></small></label><label>First name<input name="firstName"
                        type="text" required /><small class="field-error"
                        data-error-for="firstName"></small></label><label>Last name<input name="lastName" type="text"
                        required /><small class="field-error" data-error-for="lastName"></small></label><label>Date of
                    birth<input name="dateOfBirth" type="date" required /><small class="field-error"
                        data-error-for="dateOfBirth"></small></label><label>Country<select name="country" required>
                        <option value="">Select country</option>
                        <option>United Kingdom</option>
                        <option>United States</option>
                        <option>Canada</option>
                        <option>Australia</option>
                        <option>Other</option>
                    </select><small class="field-error" data-error-for="country"></small></label>
            </div>
            <label class="check-label"><input name="terms" type="checkbox" required /><span>I understand this is a local
                    browser account.</span></label><small class="field-error" data-error-for="terms"></small>
            <div class="form-feedback" role="status" aria-live="polite"></div>
            <button class="button button-primary button-wide" type="submit">
                Create pilot profile <span>-></span>
            </button>
            <p class="form-switch">
                Already registered? <a href="login.html">Log in</a>
            </p>
        </form>
    </main>

    <footer class="site-footer">
        <span>Arena Defender</span><span>Local pilot network</span><a href="about.html">About the project</a>
    </footer>
</body>

</html>
