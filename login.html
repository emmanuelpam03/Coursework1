<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arena Defender | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/main.css" />
    <script type="module" src="js/app.js"></script>
  </head>
<body data-page="login">
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Arena Defender home"
        ><span class="brand-mark">AD</span><span>Arena <b>Defender</b></span></a
      >
      <nav class="site-nav" aria-label="Primary navigation">
        <a href="game.html">Play</a><a href="rankings.html">Rankings</a
        ><a href="instructions.html">How to play</a
        ><span class="nav-account" data-auth-slot></span>
      </nav>
      <button
        class="menu-toggle"
        type="button"
        aria-label="Open navigation"
        aria-expanded="false"
      >
        Menu
      </button>
    </header>
    <main class="form-page login-page">
      <div class="form-intro">
        <p class="eyebrow">player access / 02</p>
        <h1>Welcome<br /><em>back.</em></h1>
        <p>Pick up where you left off. Your latest run is waiting.</p>
      </div>
      <form class="form-panel compact" id="login-form" novalidate>
        <div class="form-panel-heading">
          <span>Access console</span><span class="signal-live">Secure</span>
        </div>
        <label
          >Username or email<input
            name="identifier"
            type="text"
            autocomplete="username"
            required /><small
            class="field-error"
            data-error-for="identifier"
          ></small></label
        ><label
          >Password<input
            name="password"
            type="password"
            autocomplete="current-password"
            required /><small
            class="field-error"
            data-error-for="password"
          ></small
        ></label>
        <div class="form-feedback" role="status" aria-live="polite"></div>
        <button class="button button-primary button-wide" type="submit">
          Enter console <span>-></span>
        </button>
        <p class="form-switch">
          New player? <a href="register.html">Create an account</a>
        </p>
      </form>
    </main>
    <footer class="site-footer">
      <span>Arena Defender</span><span>Local player network</span
      ><a href="about.html">About the project</a>
    </footer>
  </body>
</html>
